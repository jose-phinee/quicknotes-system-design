<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>An API client that talks to JSONPlaceholder.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form" novalidate>
          <label for="title-input">Title (required, up to 100 characters)</label>
          <input type="text" id="title-input" placeholder="Note title" />

          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" rows="3" placeholder="Write your note..."></textarea>

          <button type="submit" id="submit-btn">Add Note</button>
        </form>
      </section>

      <section>
        <h2>Your notes</h2>
        <button type="button" id="load-btn">Load notes</button>
        <p id="status" role="status"></p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Practice project using the JSONPlaceholder fake API.</p>
    </footer>
  </body>
</html>
